# Deploy to Bloxity Hosting.
#
#   push to dev   -> Bloxity "dev"  channel
#   push to main  -> Bloxity "prod" channel
#
# Two halves, because the game is two things: a Colyseus server that runs as a
# long-lived container, and a static Vite build.
#
#   server          builds the Dockerfile, pushes it to GHCR tagged with the
#                   commit SHA, and rolls it on Legion
#   client          builds the Vite client with this channel's backend URL
#                   baked in, checks it, and zips it (index.html at the root)
#   publish-client  uploads that zip to Bloxity frontend hosting - only once
#                   the server of the SAME commit is live
#
# The client BUILDS in parallel with the server image, but it is PUBLISHED only
# after the server deploy succeeded. The Colyseus schema lives in shared/, so a
# client published ahead of its server speaks a protocol that server does not
# have yet; a failed server deploy must leave players on the previous PAIR.
#
# ENDPOINTS - both from https://hosting.bloxity.io/docs, and both checked
# against the live API with an unauthenticated request plus a negative control
# (the route exists iff it answers 401 while its made-up sibling answers 404):
#
#   POST https://legion.bloxity.io/v1/apps/{gameId}/deploy        -> 401
#   POST https://legion.bloxity.io/v1/apps/{gameId}/not-a-route   -> 404
#   POST https://api.bloxity.io/v1/hosting/games/{gameId}/frontend -> 401
#   POST https://api.bloxity.io/v1/hosting/games/{gameId}/client   -> 404
#
# The only secret is LEGION_DEPLOY_TOKEN. It is read from `secrets`, handed to
# curl through the environment and never echoed.
name: Deploy to Bloxity

on:
  push:
    branches: [dev, main]
  # A manual re-run of a branch. The channel still comes from the branch, so a
  # dispatch on `dev` can never publish to prod.
  workflow_dispatch:

concurrency:
  # One deploy per branch at a time. Two overlapping runs would race to publish
  # the same channel and the winner would be whichever finished last, not
  # whichever was newer.
  group: bloxity-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The Bloxity Hosting game id (hosting.bloxity.io -> My Games).
  #
  # Not necessarily the SDK slug. The slug the client initialises the SDK with,
  # and the server verifies login tokens against, is BLOXITY_GAME_SLUG in
  # shared/src/config/bloxity.ts - a separate registration that happens to be
  # spelled the same for this game. The `client` job asserts it is in the
  # bundle.
  BLOXITY_GAME_ID: ronaldo-obby-escape

  # ghcr.io/<owner>/<game>-server, the shape the docs use. Named explicitly
  # because a repository named like "-1_Ronaldo_Obby_Escape" is not a valid
  # Docker reference (no leading dash, no uppercase). Legion pulls it
  # anonymously, so the GHCR package must be PUBLIC.
  IMAGE_NAME: ghcr.io/saycheesexd/ronaldo-obby-escape-server

  # seatCap is the room's player cap and MUST equal the Colyseus room's
  # maxClients (MAX_CLIENTS in server/src/rooms/GorgeRoom.ts): Legion fills a
  # pod to seatCap and then spawns the next. maxReplicas is the pod ceiling, so
  # capacity is 15 x 5 = 75 concurrent players per channel.
  SEAT_CAP: '15'
  MAX_REPLICAS: '5'

  # The two documented hosts. They are different on purpose: containers are
  # rolled by the Legion control plane, static frontends are uploaded to the
  # platform API.
  LEGION_API: https://legion.bloxity.io
  HOSTING_API: https://api.bloxity.io

jobs:
  # Which channel this run publishes to, decided once so every job agrees.
  channel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      name: ${{ steps.pick.outputs.name }}
      backend: ${{ steps.pick.outputs.backend }}
      socket: ${{ steps.pick.outputs.socket }}
      frontend: ${{ steps.pick.outputs.frontend }}
    steps:
      - id: pick
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$BRANCH" in
            dev)
              CHANNEL=dev
              HOST="${BLOXITY_GAME_ID}.dev.host.bloxity.io"
              PLAY="${BLOXITY_GAME_ID}.dev.play.bloxity.io" ;;
            main)
              CHANNEL=prod
              HOST="${BLOXITY_GAME_ID}.host.bloxity.io"
              PLAY="${BLOXITY_GAME_ID}.play.bloxity.io" ;;
            *)
              echo "::error::Only 'dev' (-> dev) and 'main' (-> prod) deploy; '$BRANCH' does not."
              exit 1 ;;
          esac
          {
            echo "name=$CHANNEL"
            echo "backend=https://$HOST"
            echo "socket=wss://$HOST"
            echo "frontend=https://$PLAY"
          } >> "$GITHUB_OUTPUT"
          echo "Branch '$BRANCH' -> channel '$CHANNEL'"
          echo "  backend  https://$HOST  (socket wss://$HOST)"
          echo "  frontend https://$PLAY"

  # ------------------------------------------------------------------ server
  server:
    needs: channel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required to push to ghcr.io with the built-in GITHUB_TOKEN.
      packages: write
    env:
      CHANNEL: ${{ needs.channel.outputs.name }}
      BACKEND_URL: ${{ needs.channel.outputs.backend }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the server image
        uses: docker/build-push-action@v6
        with:
          # The repository root: the Dockerfile installs the whole npm
          # workspace because the server imports @obby/shared. `.dockerignore`
          # narrows it to the three manifests, shared/ and server/.
          context: .
          file: ./Dockerfile
          push: true
          # An IMMUTABLE "<channel>-<sha>" tag, which is what gets deployed,
          # and a moving "<channel>" pointer for humans reading the package
          # list. Deploying the moving one would let a re-run roll out
          # whatever a later push had since overwritten.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.channel.outputs.name }}-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:${{ needs.channel.outputs.name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll the server on Legion
        env:
          TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          IMAGE="${IMAGE_NAME}:${CHANNEL}-${GITHUB_SHA}"
          URL="${LEGION_API}/v1/apps/${BLOXITY_GAME_ID}/deploy"

          # The documented body. seatCap and maxReplicas are numbers - hence
          # --argjson. No port is sent: Legion injects PORT and the server
          # reads it. `version` is the commit SHA, which makes the deployment
          # immutable and traceable to one push, and matches the frontend's.
          PAYLOAD=$(jq -n \
            --arg channel "$CHANNEL" \
            --arg image "$IMAGE" \
            --arg version "$GITHUB_SHA" \
            --argjson seatCap "$SEAT_CAP" \
            --argjson maxReplicas "$MAX_REPLICAS" \
            '{channel: $channel, image: $image, version: $version, seatCap: $seatCap, maxReplicas: $maxReplicas}')

          echo "POST $URL"
          echo "$PAYLOAD" | jq .

          HTTP=$(curl -sS -o /tmp/deploy.out -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$PAYLOAD") || true

          echo "--- response ($HTTP) ---"
          cat /tmp/deploy.out || true
          echo

          case "$HTTP" in
            2*) echo "Server $GITHUB_SHA rolled on '$CHANNEL' (seatCap $SEAT_CAP, maxReplicas $MAX_REPLICAS)." ;;
            401|403)
              echo "::error::Legion rejected the token. Re-copy LEGION_DEPLOY_TOKEN from My Games on hosting.bloxity.io."
              exit 1 ;;
            404)
              echo "::error::No such app on Legion - check that '${BLOXITY_GAME_ID}' matches the game id on hosting.bloxity.io."
              exit 1 ;;
            *)
              echo "::error::Server deploy failed with HTTP $HTTP. If Legion reports it cannot pull the image, make the GHCR package public."
              exit 1 ;;
          esac

      # Informational only. Legion rolls pods asynchronously and an idle dev
      # channel scales to zero, so a slow first answer is not a failed deploy -
      # this reports what the endpoint says rather than gating on it. /health
      # is the server's existing probe, unchanged.
      - name: Report backend health
        continue-on-error: true
        run: |
          for attempt in $(seq 1 12); do
            BODY=$(curl -sS --max-time 10 "${BACKEND_URL}/health" || true)
            echo "attempt $attempt: $BODY"
            case "$BODY" in *'"status":"ok"'*) echo "Backend healthy at ${BACKEND_URL}/health"; exit 0 ;; esac
            sleep 10
          done
          echo "::warning::${BACKEND_URL}/health did not answer ok within two minutes. The pod may still be starting; check the Legion dashboard."

  # ------------------------------------------------------------------ client
  client:
    needs: channel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHANNEL: ${{ needs.channel.outputs.name }}
      # Baked in at build time - Vite has no later step in which to inject it.
      # Without it the client derives a URL from the page's own host, which on
      # *.play.bloxity.io is not the backend.
      VITE_SERVER_URL: ${{ needs.channel.outputs.socket }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Satisfies the root engines field (>=20.11).
          node-version: '20'
          cache: npm

      - run: npm ci

      # The repo's own gates, before anything is built for publishing.
      - name: Typecheck and verify assets
        run: |
          set -euo pipefail
          npm run typecheck
          npm run verify:assets

      - name: Build the client
        run: |
          set -euo pipefail
          echo "channel=$CHANNEL  VITE_SERVER_URL=$VITE_SERVER_URL"
          npm run build:client

          # The backend URL is the one thing a wrong channel would get wrong
          # silently: a dev build pointed at prod plays fine and writes test
          # progress onto the live leaderboard.
          grep -rqF "$VITE_SERVER_URL" client/dist/assets \
            || { echo "::error::$VITE_SERVER_URL is not baked into the bundle."; exit 1; }
          echo "Backend URL confirmed in the bundle."

          # The SDK slug (shared/src/config/bloxity.ts), compiled in. A wrong
          # slug silently breaks login, friends and Bux while the game runs.
          grep -rqF 'ronaldo-obby-escape' client/dist/assets \
            || { echo "::error::SDK gameSlug ronaldo-obby-escape is missing from the bundle."; exit 1; }
          echo "SDK gameSlug confirmed in the bundle."

      - name: Check the build against the 12 MB budget
        run: |
          set -euo pipefail
          BYTES=$(du -sb client/dist | cut -f1)
          MB=$(awk -v b="$BYTES" 'BEGIN{printf "%.2f", b/1048576}')
          echo "client/dist = ${MB} MB"
          if [ "$BYTES" -gt 12582912 ]; then
            echo "::error::client/dist is ${MB} MB, over the 12 MB budget."
            exit 1
          fi

      - name: Package the client
        run: |
          set -euo pipefail
          test -f client/dist/index.html || { echo "::error::client/dist/index.html is missing."; exit 1; }
          # Zipped from INSIDE client/dist so index.html sits at the archive
          # ROOT, not under a dist/ directory the host would serve as a subpath.
          (cd client/dist && zip -qr "${GITHUB_WORKSPACE}/client-dist.zip" .)
          ls -la client-dist.zip
          unzip -l client-dist.zip
          unzip -Z1 client-dist.zip | grep -qx 'index.html' \
            || { echo "::error::index.html is not at the archive root."; exit 1; }

      - name: Keep the bundle on the run
        uses: actions/upload-artifact@v4
        with:
          name: client-${{ needs.channel.outputs.name }}-${{ github.sha }}
          path: client-dist.zip
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------- publish client
  publish-client:
    # Only once the server of this same commit is live - see the header.
    needs: [channel, server, client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHANNEL: ${{ needs.channel.outputs.name }}
      FRONTEND_URL: ${{ needs.channel.outputs.frontend }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-${{ needs.channel.outputs.name }}-${{ github.sha }}

      - name: Upload the client to Bloxity Hosting
        env:
          TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::LEGION_DEPLOY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          unzip -Z1 client-dist.zip | grep -qx 'index.html' \
            || { echo "::error::index.html is not at the archive root."; exit 1; }

          # The documented route. `version` is required - the dashboard uses it
          # to show whether the frontend matches the deployed backend, and the
          # commit SHA is what the server deploy sent too.
          URL="${HOSTING_API}/v1/hosting/games/${BLOXITY_GAME_ID}/frontend?channel=${CHANNEL}&version=${GITHUB_SHA}"
          echo "POST $URL"

          # The zip is the raw request BODY, not a multipart field.
          HTTP=$(curl -sS -o /tmp/upload.out -w '%{http_code}' \
            -X POST "$URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-Type: application/zip' \
            --data-binary @client-dist.zip) || true

          echo "--- response ($HTTP) ---"
          cat /tmp/upload.out || true
          echo

          case "$HTTP" in
            2*) echo "Client $GITHUB_SHA published to '$CHANNEL': $FRONTEND_URL" ;;
            401|403)
              echo "::error::Bloxity rejected the token. Re-copy LEGION_DEPLOY_TOKEN from My Games on hosting.bloxity.io."
              exit 1 ;;
            404)
              echo "::error::No such game on Bloxity Hosting - check that '${BLOXITY_GAME_ID}' matches the game id on hosting.bloxity.io."
              exit 1 ;;
            *)
              echo "::error::Client upload failed with HTTP $HTTP. The bundle is attached to this run as an artifact."
              exit 1 ;;
          esac
